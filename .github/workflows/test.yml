# ============================================================
#  Docker Manager - Test CI
#  触发条件: push 到 main / Pull Request
#  内容:
#    1. unit  — server 单元测试（自包含，无需 Docker）
#    2. api   — server API 集成测试（需本机 Docker 守护进程 + 9528 后端）
#    3. docs  — 文档图片死链校验（AGENTS.md 提交远端前检查项）
# ============================================================
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --ignore-scripts
      - run: npm run test:server:unit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run docs:check

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --ignore-scripts
      - name: Start backend (9528)
        run: npm run dev:server > server.log 2>&1 &
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9528/api/health; then
              echo; echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"
          tail -50 server.log
          exit 1
      - run: npm run test:server:api
      - name: Dump server log
        if: failure()
        run: tail -100 server.log
