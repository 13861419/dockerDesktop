# ============================================================
#  AI Review — 第 2 层：每个 PR 自动 AI 代码审查
#  运行位置: 自托管 runner（自己的电脑）。
#    原因: 团队使用的中转站模型接口不对 GitHub 托管 runner（海外 IP）开放，
#          只有自家机器能访问，故把该 job 派发到本机执行。
#  触发条件: PR 打开 / 新提交推送 / 重新打开（fork PR 不执行，保护本机安全）
#  行为:
#    - 按 REVIEW.md 章程审查 diff，发现按 Important / Nit / Pre-existing
#      分级，附文件+行号证据，以 PR 评论形式输出
#    - 审查发现为建议性质，不阻塞合并；合并仍由人类批准把关（第 5 层）
#  前置条件:
#    1. 本机已注册 GitHub 自托管 runner（Settings → Actions → Runners）
#    2. runner 机器 git / node ≥ 18 可用（PATH 中可寻址，node 需内置 fetch）
#    3. runner 机器能访问 AI 接口基地址（AI_BASE_URL）
#    4. 仓库 Settings → Secrets and variables → Actions:
#       Secret   AI_API_KEY   — OpenAI 兼容接口的 API Key（必填，未配置时 job 优雅跳过）
#       Variable AI_BASE_URL  — 接口基地址（默认 https://api.deepseek.com）
#       Variable AI_MODEL     — 模型名（默认 deepseek-chat）
# ============================================================
name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: ai-review
    runs-on: self-hosted
    # 公共仓库的 fork PR 一律不在本机 runner 上执行（防止在他机运行任意代码）
    if: github.event.pull_request.head.repo.fork != true
    steps:
      - name: Checkout（含网络抖动自动重试，替代 actions/checkout）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf .git ./* .[!.]* 2>/dev/null || true
          ok=0
          for i in 1 2 3 4 5; do
            if git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .; then
              ok=1; break
            fi
            echo "第 ${i} 次克隆失败（疑似本机到 github.com 网络抖动），15 秒后重试..."
            rm -rf .git ./* .[!.]* 2>/dev/null || true
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::连续 5 次克隆失败，检查本机到 github.com 的网络连通性"
            exit 1
          fi

      - name: AI 审查（按 REVIEW.md 标准）
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/ai-review.js
