# ============================================================
#  Docker Manager - Release CI (全渠道发布)
#  触发条件: push tag v*
#  发布渠道:
#    1. GitHub Releases — zip / deb / rpm
#    2. ghcr.io — Docker 镜像（多架构）
#    3. GitHub Packages (npm)
#    4. GitHub Pages — APT 仓库源
# ============================================================
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dockerdesktop

jobs:
  # ==========================================================
  #  1. GitHub Releases
  # ==========================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --ignore-scripts
      - run: npm run build --workspace web
      - run: npx tsc --project server/tsconfig.json
      - run: node packaging/build-release.js
      - name: Create release zip
        run: Compress-Archive -Path dist-release/DockerManager -DestinationPath dist-release/DockerManager-windows-amd64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/DockerManager-windows-amd64.zip

  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --ignore-scripts
      - run: npm run build --workspace web
      - run: npx tsc --project server/tsconfig.json
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot
      - name: Build .deb packages
        run: bash packaging/linux/build-deb-ci.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/docker-manager-*.deb

  build-centos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --ignore-scripts
      - run: npm run build --workspace web
      - run: npx tsc --project server/tsconfig.json
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build .rpm packages
        run: bash packaging/linux/build-rpm-ci.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/docker-manager-*.rpm

  checksums:
    needs: [build-windows, build-ubuntu, build-centos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.12
        with:
          tag: ${{ github.ref_name }}
          fileName: "*"
          out-file-path: artifacts
      - name: Generate sha256sums
        run: |
          cd artifacts
          find . -type f \( -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec sha256sum {} \; > ../sha256sums.txt
          cat ../sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: sha256sums.txt

  # ==========================================================
  #  2. ghcr.io — Docker 多架构镜像
  # ==========================================================
  publish-docker:
    runs-on: ubuntu-24.04
    needs: [checksums]
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=${{ matrix.arch }},enable=true
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platform: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  docker-manifest:
    runs-on: ubuntu-24.04
    needs: [publish-docker]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker manifest create ${{ env.REGISTRY }}/${IMAGE_LOWER}:${VERSION} \
            ${{ env.REGISTRY }}/${IMAGE_LOWER}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${IMAGE_LOWER}:${VERSION}-arm64
          docker manifest create ${{ env.REGISTRY }}/${IMAGE_LOWER}:latest \
            ${{ env.REGISTRY }}/${IMAGE_LOWER}:latest-amd64 \
            ${{ env.REGISTRY }}/${IMAGE_LOWER}:latest-arm64
          docker manifest push ${{ env.REGISTRY }}/${IMAGE_LOWER}:${VERSION}
          docker manifest push ${{ env.REGISTRY }}/${IMAGE_LOWER}:latest

  # ==========================================================
  #  3. GitHub Packages (npm)
  # ==========================================================
  publish-npm:
    runs-on: ubuntu-24.04
    needs: [checksums]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@13861419'
      - run: npm install --ignore-scripts
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================
  #  4. GitHub Pages — APT 仓库
  # ==========================================================
  publish-repo:
    runs-on: ubuntu-24.04
    needs: [build-ubuntu]
    steps:
      - uses: actions/checkout@v4
      - name: Download deb artifacts
        uses: robinraju/release-downloader@v1.12
        with:
          tag: ${{ github.ref_name }}
          fileName: "docker-manager-*.deb"
          out-file-path: dist/deb
      - name: Install dpkg-scanpackages
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Generate APT repo metadata
        run: |
          mkdir -p dist/rpm
          chmod +x packaging/linux/generate-repo.sh
          bash packaging/linux/generate-repo.sh dist/deb dist/rpm pages-site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy-pages:
    runs-on: ubuntu-24.04
    needs: [publish-repo]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
